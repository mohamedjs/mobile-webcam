name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shared-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & test shared package
        run: |
          npm run build --workspace=@mobile-webcam/shared
          npm test --workspace=@mobile-webcam/shared

      - name: Build & test desktop server
        run: |
          npm run build --workspace=@mobile-webcam/server
          npm test --workspace=@mobile-webcam/server

      - name: Server CLI smoke check
        run: |
          node server/dist/main.js --version
          node server/dist/main.js doctor || true

      - name: Linux .deb packaging test
        run: |
          bash packaging/linux/build-deb.sh 0.1.0 amd64

  # Same build the Windows release runs, without publishing anything.
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and package
        shell: bash
        run: |
          npm ci
          npm run build --workspace=@mobile-webcam/shared
          npm run build --workspace=@mobile-webcam/server
          node server/dist/webcamo-bundle.cjs --version
          bash packaging/windows/build-win.sh 0.0.0-ci

  mobile-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app (Expo SDK 58)
        working-directory: mobile
        run: npm run typecheck

      - name: Evaluate Expo config
        working-directory: mobile
        run: npx expo config --type public

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

  # Compiles the Kotlin native module and the whole app. Until this job existed
  # the Android code had never been built anywhere.
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle.log || {
            # Surface compiler errors as annotations so they show without opening the log.
            grep -E '^e: |error:|What went wrong|FAILURE' -A3 gradle.log | head -80 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'; echo
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: webcamo-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Compiles the Swift native module for the simulator, unsigned. Catches
  # compiler errors without needing an Apple signing identity in CI.
  ios-build:
    # Expo SDK 58 builds with Xcode 27 (Swift 6.4); older Xcode fails inside
    # expo-modules-jsi with Swift concurrency errors.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List installed Xcode versions
        run: ls -d /Applications/Xcode*.app | tr '\n' ' ' | sed 's/^/::notice::/'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - run: xcodebuild -version | tr '\n' ' ' | sed 's/^/::notice::/'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native iOS project (runs pod install)
        working-directory: mobile
        run: npx expo prebuild --platform ios

      - name: Build for iOS Simulator (unsigned)
        working-directory: mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          set -o pipefail
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
            # Surface compiler errors as annotations so they show without opening the log.
            grep -E 'error:|\*\* BUILD FAILED' xcodebuild.log | sort -u | head -80 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error::/'; echo
            tail -80 xcodebuild.log
            exit 1
          }
