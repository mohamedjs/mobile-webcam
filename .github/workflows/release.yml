name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and Package Linux
        run: |
          npm ci
          npm run build --workspace=@mobile-webcam/shared
          npm run build --workspace=@mobile-webcam/server
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || '0.1.0' }}"
          VERSION="${VERSION#v}"
          bash packaging/linux/build-deb.sh "$VERSION" amd64

      - name: Upload Linux Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version || '0.1.0' }}
          files: |
            dist/webcamo_*_amd64.deb
            dist/webcamo-linux-x86_64-*.tar.gz

  macos:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and Package macOS
        run: |
          npm ci
          npm run build --workspace=@mobile-webcam/shared
          npm run build --workspace=@mobile-webcam/server
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || '0.1.0' }}"
          VERSION="${VERSION#v}"
          bash packaging/macos/build-app.sh "$VERSION" "${{ matrix.arch }}"

      - name: Upload macOS Zip
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version || '0.1.0' }}
          files: dist/Webcamo-*-macos-${{ matrix.arch }}.zip

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        if: matrix.arch == 'arm64' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: v${{ github.event.inputs.version || '0.1.0' }}
          files: dist/webcamo-v*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and Package Windows
        shell: bash
        run: |
          npm ci
          npm run build --workspace=@mobile-webcam/shared
          npm run build --workspace=@mobile-webcam/server
          VERSION="${{ github.event.inputs.version || github.event.release.tag_name || '0.1.0' }}"
          VERSION="${VERSION#v}"
          bash packaging/windows/build-win.sh "$VERSION"
          if [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=${VERSION}" packaging/windows/webcamo.iss
          elif command -v iscc >/dev/null 2>&1; then
            iscc "/DAppVersion=${VERSION}" packaging/windows/webcamo.iss
          fi

      - name: Upload Windows Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version || '0.1.0' }}
          files: |
            dist/webcamo-windows-x64-*.zip
            dist/webcamo-setup-v*.exe
